name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Compilar
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee compilar.log
      - uses: actions/upload-artifact@v4
        with:
          name: ope-ope-no-mi-mod
          path: build/libs/*.jar
      - name: Guardar el jar en la rama "jar"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          mkdir -p /tmp/jar && cp "$JAR" /tmp/jar/OpeOpeNoMi-1.21.1.jar
          cd /tmp/jar
          git init -q -b jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "jar del commit ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" jar
      - name: Prueba servidor (arranca y genera un mundo)
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          set +e
          (sleep 150; echo stop) | timeout 600 ./gradlew runServer --console=plain 2>&1 | tee servidor.log
          rc=${PIPESTATUS[1]}
          set -e
          echo "exit=$rc"
          grep -q 'ROOM listo' servidor.log
          grep -q 'Done (' servidor.log
          if grep -qiE 'Mixin apply|MixinApplyError|Reported exception thrown|Exception in thread' servidor.log; then exit 1; fi
          [ "$rc" = "0" ]
      - name: Prueba cliente (arranca y entra al mundo)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb imagemagick x11-apps libgl1-mesa-dri > /dev/null
          mkdir -p run/saves capturas && cp -r run/world run/saves/Prueba && rm -f run/saves/Prueba/session.lock
          ls -la run/saves/Prueba
          printf 'onboardAccessibility:false\nnarrator:0\nlang:es_es\ntutorialStep:none\n' > run/options.txt
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          sleep 2
          export DISPLAY=:99
          set +e
          timeout 600 ./gradlew runSmokeClient --console=plain > cliente.log 2>&1 &
          GPID=$!
          for i in $(seq 1 20); do
            sleep 30
            import -window root "capturas/pantalla-$((i*30))s.png" 2>/dev/null || xwd -root -silent 2>/dev/null | convert xwd:- "capturas/pantalla-$((i*30))s.png" || true
            if ! kill -0 $GPID 2>/dev/null; then break; fi
          done
          wait $GPID; rc=$?
          set -e
          echo "exit=$rc"
          cp -f run/screenshots/autotest-*.png capturas/ 2>/dev/null || true
          echo "----- prueba automática (cortes, HUD, controles y ROOM) -----"
          grep -E "AUTOTEST|Corte:" cliente.log || true
          echo "----- avisos de sonidos y texturas (solo información) -----"
          grep -iE 'Unable to play unknown soundEvent|Missing sprite|missing texture|Couldn.t load' cliente.log | head -40 || true
          echo "----- últimas líneas de cliente.log -----"
          grep -vE "Downloading|Download " cliente.log | tail -60
          grep -q 'cliente listo' cliente.log
          if grep -qiE 'Mixin apply|MixinApplyError|Reported exception thrown' cliente.log; then exit 1; fi
          grep -qE 'joined the game|se ha unido a la partida' cliente.log
          grep -q 'AUTOTEST terminado' cliente.log
          if grep -q 'AUTOTEST FALLO' cliente.log; then grep 'AUTOTEST FALLO' cliente.log; exit 1; fi
          [ "$rc" = "0" ] || [ "$rc" = "124" ]
      - name: Galería de técnicas de Law (capturas de cada técnica)
        if: startsWith(github.ref_name, 'law-') || contains(github.event.head_commit.message, '[galeria]')
        continue-on-error: true
        run: |
          export DISPLAY=:99
          pgrep Xvfb > /dev/null || (Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &)
          sleep 2
          rm -f run/saves/Prueba/session.lock run/screenshots/autotest-law-*.png
          mkdir -p capturas/galeria
          set +e
          timeout 540 ./gradlew runGalleryClient --console=plain > galeria.log 2>&1
          echo "exit=$?"
          set -e
          for f in run/screenshots/autotest-law-*.png; do
            [ -f "$f" ] || continue
            convert "$f" -quality 88 "capturas/galeria/$(basename "${f%.png}").jpg" || cp -f "$f" capturas/galeria/
          done
          ls capturas/galeria | wc -l
          grep -E "AUTOTEST galería" galeria.log | tail -90 || true
      - name: Galería de la Mera Mera no Mi (capturas de cada técnica de Ace)
        if: startsWith(github.ref_name, 'mera-') || contains(github.event.head_commit.message, '[galeria-mera]')
        continue-on-error: true
        run: |
          export DISPLAY=:99
          pgrep Xvfb > /dev/null || (Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &)
          sleep 2
          rm -f run/saves/Prueba/session.lock run/screenshots/autotest-mera-*.png
          mkdir -p capturas/mera
          set +e
          command -v ffmpeg > /dev/null || sudo apt-get install -y -qq ffmpeg > /dev/null
          # el video de la galería: se graba la pantalla mientras Ace usa cada técnica
          ffmpeg -loglevel error -y -f x11grab -framerate 30 -video_size 1280x720 -i :99 -c:v libx264 -preset ultrafast -crf 20 /tmp/mera-crudo.mp4 &
          FPID=$!
          GRAB0=$(date -u +%s)
          timeout 540 ./gradlew runMeraGalleryClient --console=plain > galeria-mera.log 2>&1
          echo "exit=$?"
          kill -INT $FPID; wait $FPID
          # sin la pantalla de carga: desde un poco antes de la primera técnica
          T1=$(grep -m1 'AUTOTEST galería hiken' galeria-mera.log | sed -E 's/^\[([0-9:]+)\].*/\1/')
          SS=0
          if [ -n "$T1" ]; then SS=$(( $(date -u -d "$(date -u +%F) $T1" +%s) - GRAB0 - 3 )); fi
          [ "$SS" -lt 0 ] && SS=0
          echo "recorte inicial: $SS s"
          ffmpeg -loglevel error -y -ss "$SS" -i /tmp/mera-crudo.mp4 -vf "scale=1280:720" -c:v libx264 -preset slow -crf 26 -pix_fmt yuv420p -movflags +faststart capturas/mera-video.mp4 || true
          ls -la capturas/mera-video.mp4 || true
          set -e
          for f in run/screenshots/autotest-mera-*.png; do
            [ -f "$f" ] || continue
            convert "$f" -quality 88 "capturas/mera/$(basename "${f%.png}").jpg" || cp -f "$f" capturas/mera/
          done
          ls capturas/mera | wc -l
          grep -E "AUTOTEST galería|Exception|Error" galeria-mera.log | tail -120 || true
      - name: Guardar registros y capturas en la rama "ci-logs"
        if: always()
        run: |
          mkdir -p /tmp/ci-logs
          cp -f compilar.log servidor.log cliente.log galeria.log galeria-mera.log /tmp/ci-logs/ 2>/dev/null || true
          cp -rf capturas /tmp/ci-logs/ 2>/dev/null || true
          # el jar de esta ejecución, para instalarlo sin iniciar sesión en GitHub (los artefactos la piden)
          JAR=$(ls build/libs/*.jar 2>/dev/null | grep -v -- '-sources' | head -1 || true)
          if [ -n "$JAR" ]; then
            cp -f "$JAR" /tmp/ci-logs/OpeOpeNoMi-1.21.1.jar
            (cd /tmp/ci-logs && sha256sum OpeOpeNoMi-1.21.1.jar > OpeOpeNoMi-1.21.1.jar.sha256)
          fi
          echo "${{ github.sha }} ${{ github.ref_name }} ejecución ${{ github.run_id }}" > /tmp/ci-logs/commit.txt
          cd /tmp/ci-logs && git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "registros de la ejecución ${{ github.run_id }}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
