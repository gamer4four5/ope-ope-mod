name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Compilar
        run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ope-ope-no-mi-mod
          path: build/libs/*.jar
      - name: Prueba servidor (arranca y genera un mundo)
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          set +e
          (sleep 150; echo stop) | timeout 600 ./gradlew runServer --console=plain 2>&1 | tee servidor.log
          rc=${PIPESTATUS[1]}
          set -e
          echo "exit=$rc"
          grep -q 'ROOM listo' servidor.log
          grep -q 'Done (' servidor.log
          if grep -qiE 'Mixin apply|MixinApplyError|Reported exception thrown|Exception in thread' servidor.log; then exit 1; fi
          [ "$rc" = "0" ]
      - name: Prueba cliente (arranca y entra al mundo)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          mkdir -p run/saves && cp -r run/world run/saves/Prueba && rm -f run/saves/Prueba/session.lock
          set +e
          timeout 480 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runSmokeClient --console=plain 2>&1 | tee cliente.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit=$rc"
          grep -q 'cliente listo' cliente.log
          grep -q 'joined the game' cliente.log
          if grep -qiE 'Mixin apply|MixinApplyError|Reported exception thrown' cliente.log; then exit 1; fi
          [ "$rc" = "124" ]
      - name: Guardar el jar en la rama "jar"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          mkdir -p /tmp/jar && cp "$JAR" /tmp/jar/OpeOpeNoMi-1.21.1.jar
          cd /tmp/jar
          git init -q -b jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "jar del commit ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" jar
