name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Compilar
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee compilar.log
      - uses: actions/upload-artifact@v4
        with:
          name: ope-ope-no-mi-mod
          path: build/libs/*.jar
      - name: Guardar el jar en la rama "jar"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          mkdir -p /tmp/jar && cp "$JAR" /tmp/jar/OpeOpeNoMi-1.21.1.jar
          cd /tmp/jar
          git init -q -b jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "jar del commit ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" jar
      - name: Prueba servidor (arranca y genera un mundo)
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          set +e
          (sleep 150; echo stop) | timeout 600 ./gradlew runServer --console=plain 2>&1 | tee servidor.log
          rc=${PIPESTATUS[1]}
          set -e
          echo "exit=$rc"
          grep -q 'ROOM listo' servidor.log
          grep -q 'Done (' servidor.log
          if grep -qiE 'Mixin apply|MixinApplyError|Reported exception thrown|Exception in thread' servidor.log; then exit 1; fi
          [ "$rc" = "0" ]
      - name: Prueba cliente (arranca y entra al mundo)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb imagemagick x11-apps libgl1-mesa-dri > /dev/null
          mkdir -p run/saves capturas && cp -r run/world run/saves/Prueba && rm -f run/saves/Prueba/session.lock
          ls -la run/saves/Prueba
          printf 'onboardAccessibility:false\nnarrator:0\nlang:es_es\n' > run/options.txt
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          sleep 2
          export DISPLAY=:99
          set +e
          timeout 420 ./gradlew runSmokeClient --console=plain > cliente.log 2>&1 &
          GPID=$!
          for i in $(seq 1 14); do
            sleep 30
            import -window root "capturas/pantalla-$((i*30))s.png" 2>/dev/null || xwd -root -silent 2>/dev/null | convert xwd:- "capturas/pantalla-$((i*30))s.png" || true
            if ! kill -0 $GPID 2>/dev/null; then break; fi
          done
          wait $GPID; rc=$?
          set -e
          echo "exit=$rc"
          cp -f run/screenshots/autotest-*.png capturas/ 2>/dev/null || true
          echo "----- prueba de cortes -----"
          grep -E "AUTOTEST|Corte:" cliente.log || true
          echo "----- últimas líneas de cliente.log -----"
          grep -vE "Downloading|Download " cliente.log | tail -60
          grep -q 'cliente listo' cliente.log
          if grep -qiE 'Mixin apply|MixinApplyError|Reported exception thrown' cliente.log; then exit 1; fi
          grep -qE 'joined the game|se ha unido a la partida' cliente.log
          [ "$rc" = "124" ]
      - name: Guardar registros y capturas en la rama "ci-logs"
        if: always()
        run: |
          mkdir -p /tmp/ci-logs
          cp -f compilar.log servidor.log cliente.log /tmp/ci-logs/ 2>/dev/null || true
          cp -rf capturas /tmp/ci-logs/ 2>/dev/null || true
          cd /tmp/ci-logs && git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "registros de la ejecución ${{ github.run_id }}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
