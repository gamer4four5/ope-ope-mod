plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()
	runs {
		// Arranque de prueba usado por GitHub Actions: entra directo al mundo "Prueba".
		smokeClient {
			client()
			name "Smoke Client"
			programArgs "--quickPlaySingleplayer=Prueba"
			vmArgs "-Xmx3G", "-Dopeope.autotest=true"
			runDir "run"
		}
		// Galería de las técnicas de Law: las lanza una a una y deja capturas en run/screenshots/autotest-law-*.png
		galleryClient {
			client()
			name "Gallery Client"
			programArgs "--quickPlaySingleplayer=Prueba"
			vmArgs "-Xmx3G", "-Dopeope.autotest=true", "-Dopeope.gallery=true"
			runDir "run"
		}
		// Galería de la Mera Mera no Mi (Ace): capturas en run/screenshots/autotest-mera-*.png
		meraGalleryClient {
			client()
			name "Mera Gallery Client"
			programArgs "--quickPlaySingleplayer=Prueba"
			vmArgs "-Xmx3G", "-Dopeope.autotest=true", "-Dopeope.gallery=true", "-Dopeope.gallery.mera=true"
			runDir "run"
		}
	}
	mods {
		"opeope" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	// para probar el mod con un shaderpack (Iris + Sodium bajados de Modrinth)
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// PRUEBA: se compila contra la Fabric API del proyecto y se ejecuta con la que carga el juego real del jugador
	modCompileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${project.findProperty('fabric_runtime') ?: project.fabric_version}"
	// Prueba con shaderpack: ./gradlew runMeraGalleryClient -Psodium=<versión> -Piris=<versión>
	// (Gradle los traduce a los nombres del entorno de desarrollo; copiarlos a run/mods no funciona).
	if (project.hasProperty("sodium")) modRuntimeOnly "maven.modrinth:sodium:${project.sodium}"
	if (project.hasProperty("iris")) modRuntimeOnly "maven.modrinth:iris:${project.iris}"
}

// Iris trae dentro sus librerías (jcpp, glsl-transformer, antlr) como jars anidados, y en el entorno de desarrollo
// nadie las saca: al cargar el shaderpack faltaba org.anarres.cpp.PreprocessorListener y Photon no arrancaba.
// Aquí se sacan del jar de Iris y se ponen en el classpath de la prueba.
configurations {
	irisNested
}
if (project.hasProperty("iris")) {
	dependencies {
		irisNested("maven.modrinth:iris:${project.iris}") { transitive = false }
	}
	def irisLibsDir = layout.buildDirectory.dir("iris-libs").get().asFile
	def unpackIrisLibs = tasks.register("unpackIrisLibs", Copy) {
		from({ configurations.irisNested.collect { zipTree(it) } }) {
			include "META-INF/jars/*.jar"
			exclude "META-INF/jars/fabric-*.jar"   // las piezas de Fabric API ya están
			eachFile { it.path = it.name }
		}
		includeEmptyDirs = false
		into irisLibsDir
	}
	def irisLibs = files({ fileTree(irisLibsDir).matching { include "*.jar" }.files })
	irisLibs.builtBy(unpackIrisLibs)
	dependencies {
		runtimeOnly irisLibs
	}
}

// PRUEBA: el juego como lo lanza el launcher del jugador (nombres intermedios, el jar final del mod y los otros mods tal
// cual se bajan), con el Iris, el Sodium y la Fabric API de su juego real. En el entorno de desarrollo el Iris nuevo no
// arranca (el remapeador de mixins de desarrollo de Fabric Loader falla con uno de sus mixins), y así además se prueba
// exactamente lo que se instala.
dependencies {
	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.findProperty('fabric_runtime') ?: project.fabric_version}"
	if (project.hasProperty("prodSodium")) productionRuntimeMods "maven.modrinth:sodium:${project.prodSodium}"
	if (project.hasProperty("prodIris")) productionRuntimeMods "maven.modrinth:iris:${project.prodIris}"
}
tasks.register("prodMeraGallery", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	jvmArgs.addAll("-Xmx3G", "-Dopeope.autotest=true", "-Dopeope.gallery=true", "-Dopeope.gallery.mera=true")
	programArgs.addAll("--quickPlaySingleplayer", "Prueba")
	// -Pnoche=true: la galería a medianoche
	if (project.hasProperty("noche")) jvmArgs.add("-Dopeope.gallery.noche=true")
	// -Pancho=1920 -Palto=1080: la ventana de la galería a otro tamaño (para medir los fotogramas)
	if (project.hasProperty("ancho")) jvmArgs.add("-Dopeope.gallery.ancho=${project.ancho}")
	if (project.hasProperty("alto")) jvmArgs.add("-Dopeope.gallery.alto=${project.alto}")
	// ya hay un Xvfb de 1280x720 en la pantalla :99; con xvfb-run se abriría otra, de otro tamaño
	useXVFB = false
}

// PRUEBA: lanza como el launcher un jar YA HECHO (el que se va a instalar, o el que hay instalado) junto a los mods de
// una carpeta, sin compilar este proyecto. Así se prueba el jar exacto con copias de los mods del juego real, en una
// carpeta de juego aparte.
//   ./gradlew prodJarExterno -Pjar=<jar del mod> -PmodsDir=<carpeta con los demás mods>
//       [-PgameDir=<carpeta de juego>] [-Pflags="-Dopeope.autotest=true -Dopeope.gallery=true ..."] [-Pmundo=Prueba]
tasks.register("prodJarExterno", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	mods.setFrom(
		project.hasProperty("jar") ? files(project.property("jar")) : files(),
		project.hasProperty("modsDir") ? fileTree(dir: project.property("modsDir"), include: "*.jar") : files())
	jvmArgs.add("-Xmx3G")
	if (project.hasProperty("flags")) jvmArgs.addAll(project.property("flags").toString().trim().split(/\s+/) as List)
	programArgs.addAll("--quickPlaySingleplayer", (project.findProperty("mundo") ?: "Prueba").toString())
	if (project.hasProperty("gameDir")) runDir = file(project.property("gameDir"))
	useXVFB = false
	doFirst {
		if (!project.hasProperty("jar") || !file(project.property("jar")).isFile()) throw new GradleException("prodJarExterno: falta -Pjar=<jar del mod> o no existe")
		println "prodJarExterno: mods = " + mods.files.collect { it.name }
	}
}
// Copia a run/mods-prod los mods con los que se prueba (Fabric API, Sodium e Iris de -PprodSodium / -PprodIris),
// para dárselos a prodJarExterno con -PmodsDir=run/mods-prod
tasks.register("copiarModsProd", Sync) {
	from configurations.productionRuntimeMods
	into layout.projectDirectory.dir("run/mods-prod")
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
	// en CI se ven todos los errores de una vez, no solo los 100 primeros
	it.options.compilerArgs += ['-Xmaxerrs', '2000']
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
