plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()
	runs {
		// Arranque de prueba usado por GitHub Actions: entra directo al mundo "Prueba".
		smokeClient {
			client()
			name "Smoke Client"
			programArgs "--quickPlaySingleplayer=Prueba"
			vmArgs "-Xmx3G", "-Dopeope.autotest=true"
			runDir "run"
		}
		// Galería de las técnicas de Law: las lanza una a una y deja capturas en run/screenshots/autotest-law-*.png
		galleryClient {
			client()
			name "Gallery Client"
			programArgs "--quickPlaySingleplayer=Prueba"
			vmArgs "-Xmx3G", "-Dopeope.autotest=true", "-Dopeope.gallery=true"
			runDir "run"
		}
		// Galería de la Mera Mera no Mi (Ace): capturas en run/screenshots/autotest-mera-*.png
		meraGalleryClient {
			client()
			name "Mera Gallery Client"
			programArgs "--quickPlaySingleplayer=Prueba"
			vmArgs "-Xmx3G", "-Dopeope.autotest=true", "-Dopeope.gallery=true", "-Dopeope.gallery.mera=true"
			runDir "run"
		}
	}
	mods {
		"opeope" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
	// en CI se ven todos los errores de una vez, no solo los 100 primeros
	it.options.compilerArgs += ['-Xmaxerrs', '2000']
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
